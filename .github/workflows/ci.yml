name: Speak-to-Repo CPU CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Audio Library (libsndfile)
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Install CPU PyTorch & Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Compiler & Mermaid Syntax Unit Tests
        run: python -m unittest discover -s tests -v